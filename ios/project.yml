name: RelateBooks
options:
  bundleIdPrefix: com.johnymontana
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  relate:
    url: https://github.com/relatedb/relate
    exactVersion: 1.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  RelateBooks:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RelateBooks
        excludes:
          - "Embedding/Model"
      # The pre-compiled Core ML model and vocab as a folder reference:
      # RelateBooks.app/Model/{MiniLM_L6_v2.mlmodelc, vocab.txt}, the same
      # layout as the SwiftPM resource bundle (EmbeddingResources).
      - path: RelateBooks/Embedding/Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: relate
        product: Relate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnymontana.RelateBooks
        PRODUCT_NAME: RelateBooks
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Relate Books
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan a book's barcode to add it to your library."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  RelateBooksUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
    dependencies:
      - target: RelateBooks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnymontana.RelateBooksUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RelateBooks
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
schemes:
  RelateBooks:
    build:
      targets:
        RelateBooks: all
    test:
      targets:
        - RelateBooksUITests
    run:
      config: Debug
    archive:
      config: Release
